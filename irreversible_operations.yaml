# Declared irreversible operations for
# atoms.tool_invocation.operation_in_declared_irreversible_set.
#
# Author:  Landen Stecker
# Date:    2026-07-13
# Version: 1.0.0
# Summary: Explicit enumeration only. Never inferred. Each entry cites the
#          corpus incident that motivated membership. Novel destructive
#          commands not listed pass — residual is the containment box.

version: "1.0.0"

# Match kinds:
#   tool_names — tool_name lowercased equals one of values
#   tool_name_suffixes — tool_name ends with suffix (e.g. _delete)
#   command_substrings — terminal/shell command contains substring (casefold)
#   command_patterns — regex against command (casefold)

operations:
  - id: delete
    match:
      kind: tool_names
      values:
        - delete_file
        - delete
        - unlink
        - remove_file
        - files_delete
    incident_source: "AIID 1152 Replit prod-DB wipe; AIID 1469 Cursor/PocketOS delete; AIID 1542 OpenClaw email mass-delete"
  - id: drop
    match:
      kind: tool_names
      values:
        - drop_table
        - drop_database
        - drop_schema
    incident_source: "AIID 1152 Replit prod-DB wipe (drop/truncate class)"
  - id: truncate
    match:
      kind: tool_names
      values:
        - truncate
        - truncate_table
    incident_source: "AIID 1152 Replit prod-DB wipe (truncate class)"
  - id: destroy
    match:
      kind: tool_names
      values:
        - destroy
        - destroy_resource
        - volume_delete
        - delete_volume
        - backup_delete
        - delete_backup
    incident_source: "AIID 1469 Cursor/PocketOS volume delete; AIID 1424 Claude Code terraform destroy class"
  - id: terraform_destroy
    match:
      kind: command_substrings
      values:
        - "terraform destroy"
        - "tofu destroy"
    incident_source: "AIID 1424 Claude Code terraform destroy"
  - id: rm_recursive_force
    match:
      kind: command_patterns
      values:
        # Combined short flags: -rf / -fr / -Rf etc.
        - "\\brm\\b[^\\n]*(-[a-zA-Z]*r[a-zA-Z]*f|-rf|-fr)\\b"
        - "\\brm\\b[^\\n]*(-[a-zA-Z]*f[a-zA-Z]*r)\\b"
        # Split short flags: rm -r -f / rm -f -r (any order, other flags between)
        - "\\brm\\b(?=[^\\n]*(?:\\s+-[a-zA-Z]*r[a-zA-Z]*|\\s+--recursive))(?=[^\\n]*(?:\\s+-[a-zA-Z]*f[a-zA-Z]*|\\s+--force))"
        # Long flags alone when both recursive and force appear
        - "\\brm\\b(?=[^\\n]*--recursive)(?=[^\\n]*--force)"
    incident_source: "AIID 1469 recursive delete class"
    # Residual while the containment box is unmounted: execute_code /
    # shutil.rmtree, PowerShell Remove-Item, find -delete, git clean -fdx.
    # Those are out of scope for this matcher; do not claim coverage.
    # AIID 1178 pin REMOVED 2026-09-23. Dest-read of the AIID page and
    # google-gemini/gemini-cli#4586 shows the mechanism was a failed mkdir then a
    # series of MOVE operations that overwrote all but one file. Not rm -rf. This
    # rule never could have caught it, so the pin asserted coverage that did not
    # exist. 1178 does NOT move to another rule: overwrite-via-move is a
    # dest-existence fact and no match kind here can see it. A naive mv/Move-Item
    # rule would false-fire on `mv notes.md notes.bak`. The residual is the box.
  - id: mass_delete_by_query
    match:
      kind: tool_names
      values:
        - mass_delete
        - bulk_delete
        - delete_by_query
        - email_mass_delete
    incident_source: "AIID 1542 OpenClaw email mass-delete"
  - id: drop_sql_command
    match:
      kind: command_substrings
      values:
        - "drop table"
        - "drop database"
        - "truncate table"
    incident_source: "AIID 1152 Replit prod-DB wipe (SQL form)"
