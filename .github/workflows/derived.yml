# Generated files must be derived, not maintained.
#
# `SHA256SUMS` is a public integrity claim: these are the bytes of this
# repository. The version published before this workflow existed was written by
# hand from a Windows working tree, so it recorded that host's line endings.
# Measured against the checkout it was made on, 8 of 110 rows were stale.
# Measured against the blobs a consumer receives, 81 of 110 did not match.
#
# Nothing in the tree ever read that file, so the drift was invisible. This job
# reads `.floor/derived.tsv`, regenerates every artifact listed there, and fails
# if the committed copy differs. It then runs the consumer's own command against
# a clean checkout, because an artifact can regenerate cleanly and still be a
# false claim about the bytes a stranger downloads.
#
# Not part of the floor pack yet: only this roof publishes derived artifacts.
# Promote on evidence, not on symmetry.
#
# Action pins are commit SHAs (Hermes / estate supply-chain policy).

name: derived

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: derived-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  derived:
    name: derived (generated files)
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: every registered artifact reproduces from its generator
        run: bash .floor/craft/verify_derived.sh

      - name: manifest verifies against a clean checkout
        run: sha256sum -c SHA256SUMS
