# SHA256SUMS is a public integrity claim: these are the bytes of this repository.
#
# A hand-maintained manifest is a claim nothing checks, and it drifts silently
# the moment any file changes. This job regenerates it on GitHub's machines and
# fails if the committed file differs, so the manifest is derived, never
# maintained. It then runs the consumer's own command against a clean checkout,
# because a manifest that regenerates cleanly but fails `sha256sum -c` is still
# a false claim.
#
# Not part of the floor pack: only this roof publishes a manifest. Promote to
# the pack on evidence, not on symmetry.
#
# Action pins are commit SHAs (Hermes / estate supply-chain policy).

name: manifest

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: manifest-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  manifest:
    name: manifest (SHA256SUMS)
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: regenerate
        run: bash scripts/gen_manifest.sh

      - name: committed manifest matches the repository
        run: git diff --exit-code -- SHA256SUMS

      - name: manifest verifies against a clean checkout
        run: sha256sum -c SHA256SUMS
