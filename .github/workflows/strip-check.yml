# GIT-5: PR tests must fail when the fix is stripped.
name: strip-check

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: strip-check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  strip-check:
    name: strip-check (fixture + recipes)
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: install test deps
        run: pip install -q pytest

      - name: head fixture green
        run: python -m pytest -q tests/test_strip_ci_fixture.py

      - name: strip recipes red then restore green
        run: bash .floor/craft/strip_check.sh
